aid: tarana-wireless
name: Tarana Wireless
description: >-
  Tarana Wireless is a Milpitas, California broadband equipment company and the creator of
  next-generation fixed wireless access (ngFWA), a physical-layer approach that uses
  distributed multi-user MIMO and interference cancellation to deliver fiber-class
  performance over 3 GHz CBRS, 5 GHz and 6 GHz spectrum in non-line-of-sight conditions.
  Its G1 platform pairs base nodes and remote nodes with the Tarana Cloud Suite (TCS), a
  multi-tenant SaaS that operators use to plan, install, provision, monitor and troubleshoot
  their radio networks. TCS is the company's software and API surface: it exposes a REST
  northbound API for device inventory, network topology and geo-mapping, subscriber
  provisioning and billing integration into operator OSS/BSS systems, a configurable webhook
  and alert notification channel, CBRS SAS and 6 GHz AFC domain-proxy integrations, and
  dial-out streaming telemetry from the radios. The northbound API reference is published as
  a Swagger UI inside the operator portal and requires an authenticated TCS tenant, so the
  machine-readable contract is not publicly retrievable.

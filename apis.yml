apis:
- name: Tarana Cloud Suite (TCS) Northbound API
  description: >-
    The TCS northbound REST API is how operators wire the Tarana Cloud Suite into their own
    OSS/BSS: device inventory, network topology discovery and geo-mapping, subscriber
    provisioning, billing integration, alarm and event retrieval, and zero-touch deployment
    configuration. Tarana's own operator-portal runtime configuration publishes the API
    reference location as a Swagger UI at
    https://portal.tcs.taranawireless.com/northbound/swagger-ui.html; that path and every
    Swagger/OpenAPI sibling under it return HTTP 403 "RBAC: access denied" to anonymous
    callers, so the OpenAPI document exists but is reachable only inside an authenticated
    TCS tenant.
  humanURL: https://portal.tcs.taranawireless.com/northbound/swagger-ui.html
  baseURL: https://portal.tcs.taranawireless.com/northbound

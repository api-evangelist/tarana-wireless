entries_note: >-
  NO ENTRIES COULD BE CAPTURED, and none are invented. The release-notes topic is a Salesforce
  Experience Cloud page: the HTML that comes back to an anonymous client is a 443KB Lightning
  application shell with no article content in it, and the guest knowledge REST API
  (/services/data/v60.0/support/knowledgeArticles) returns 401 INVALID_SESSION_ID. There is
  therefore no dated entry list, no version list and no breaking-change history readable by
  any machine, including this one. The changelog exists and Tarana points customers at it; it
  is simply not published in a form anything can read without a tenant login.

method: probed
source: >-
  Direct anonymous HTTPS probes of /.well-known/* on every Tarana Wireless host discovered
  during contract discovery (marketing WordPress site, Salesforce Experience Cloud support
  portal, Tarana Cloud Suite operator portal, TCS API gateway, TCS identity provider,
  resources site and resources API).
name: Tarana Wireless — /.well-known/ probe
note: >-
  Two real documents are served. The TCS operator portal publishes an RFC 9116 security.txt
  naming a dedicated product-security mailbox (tcs-security@taranawireless.com). The
  Salesforce Experience Cloud support portal serves a complete OpenID Provider
  configuration for its own org. Everything else 404s, is RBAC-denied, or answers from an
  SPA/login catch-all. Note the two 200-that-is-not-a-document cases recorded below:
  resources.taranawireless.com is a Vue SPA that returns its 1,620-byte index.html with
  HTTP 200 for every path, and tcs.taranawireless.com returns the operator-portal HTML
  shell for /.well-known/security.txt while returning "RBAC: access denied" for every other
  path — neither is a served well-known document.
hosts:
- host: portal.tcs.taranawireless.com
  role: Tarana Cloud Suite operator portal (and northbound API host)
  documents:

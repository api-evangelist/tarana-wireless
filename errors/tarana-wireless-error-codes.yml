    MAJOR: 359
    CRITICAL: 176
    WARNING: 125
    MINOR: 49
  event_types:
    PROCESSING_ERR: 6
    EQUIPMENT: 81
    COMMUNICATION: 78
    OPERATIONAL_VIOLATION: 532
    ENVIRONMENTAL: 11
    OTHER: 1
  event_type_note: COMMUNICATION / ENVIRONMENTAL / EQUIPMENT / PROCESSING_ERR / OPERATIONAL_VIOLATION
    / OTHER are the ITU-T X.733 alarm eventType values; see conformance/tarana-wireless-conformance.yml.
  visibility_note: 'access: viewer alarms surface to any operator user; access: engineer alarms are shown
    to engineering roles.'
  codes:
  - code: approximate-time-sync
    title: Approx Time Sync
    description: Clock on the device was set to the time when it last connected to TCS. This is because
      the BN was unable to reach NTP servers or GPS was unable to get a lock. In case of RN this could
      be because the link to BN has not been established.
    severity:
    - WARNING
    event_type:
    - OPERATIONAL_VIOLATION
    visibility:
    - engineer
    resource_instances: 2
    remediation: In most cases, the alarm is usually expected to clear on its own. If the alarm stays
      raised for a particular BN for a long time, it maybe be because the GPS module does not have clear
      view of the sky. In rare cases where GPS related alarms are also seen, the GPS module might have
      developed a fault for which a truck roll and RMA is needed.

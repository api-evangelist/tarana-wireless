derived_alarms:
  count: 18
  note: Correlated alarms TCS computes in the cloud rather than receiving from a radio. resource carries
    a YANG-style instance path with %s placeholders.
  codes:
  - code: primary-bn-mismatch
    title: Primary BN Mismatch
    description: RN is not connected to primary BN.
    severity: MAJOR
    resource: /network/radios/radio[device-id=%s]
    visibility: viewer
    remediation: Consider changing the Primary BN via the RN's device page.
  - code: software-policy-mismatch
    title: Software Policy Mismatch
    description: The software version of the device is outside of the software versions defined in the
      software upgrade policy in the Operator window of TCS.
    severity: WARNING
    resource: /network/radios/radio[device-id=%s]
    visibility: viewer
    remediation: Reconfigure the upper and/or lower software-version limits of the software upgrade policy,
      or manually upgrade the device.
  - code: radio-transmit-off
    title: Radio Transmit Off
    description: Device is muted.
    severity: CRITICAL
    resource: /network/radios/radio[device-id=%s]
    visibility: viewer
    remediation: Unmute the device if not intentional.
  - code: cpi-id-missing
    title: CPI ID Missing
    description: No CPI ID available for CBRS device.
    severity: MAJOR
    resource: /network/radios/radio[device-id=%s]
    visibility: viewer
    remediation: Configure the CPI ID.
  - code: invalid-spectrum-provider-config
    title: Invalid Spectrum Config
    description: Configuration needed for Spectrum Acquisition is invalid
    severity: CRITICAL
    resource: /network/radios/radio[device-id=%s]
    visibility: engineer
    remediation: Fill in or make corrections to the SAS Provider and FCC ID configured on the Operator
      Page
  - code: software-version-not-stable
    title: Software Version Not Stable
    description: Device is running beta/custom system software.
    severity: WARNING
    resource: /network/radios/radio[device-id=%s]
    visibility: engineer
  - code: config-mismatch
    title: Configuration Mismatch
    description: Config mismatch between TCS and device.
    severity: MAJOR
    resource: /network/radios/radio[device-id=%s]
    visibility: viewer
    remediation: TCS will try to push the correct and updated configuration to the BN in order to keep
      it in sync. If this alarm doesn't go away, please contact Tarana Support.
  - code: device-unreachable
    title: Device Unreachable
    description: TCS is unable to reach device.
    severity: MAJOR
    resource: /network/radios/radio[device-id=%s]
    visibility: viewer
    remediation: Check if the backhaul is up.
  - code: rn-4carrier-mode-unsupported
    title: RN Multicarrier Capability Mismatch
    description: G1 BN-6 (or G2 BN-3+6) is operating in 4-carrier mode while RN-6 is operating in 2-carrier
      mode. This is due to the RN being on software version 1.2 or lower.
    severity: MINOR
    resource: /network/radios/radio[device-id=%s]
    visibility: engineer
    remediation: Upgrade RN to 2.0 release which supports 4-carrier mode.
  - code: incompatible-aip-config
    title: Incompatible AIP Version
    description: Air Interface Protocol Version 0 configured for BN with one or more carriers on UNII-5/UNII-7
      in sector config.
    severity: MAJOR
    resource: /network/radios/radio[device-id=%s]
    visibility: engineer
    remediation: Change BN's Air Interface Protocol Version or Sector's carrier configuration to ensure
      compatibility.
  - code: incompatible-multicarrier-config
    title: Incompatible Sector Multi-carrier Mode
    description: Sector is configured for 4-carrier operation while attached BN is capable of operating
      in 2-carrrier mode only.
    severity: MINOR
    resource: /network/radios/radio[device-id=%s]
    visibility: engineer
    remediation: Change multi-carrier configuration at sector to match BN's capability.
  - code: planning-id-unavailable
    title: Planning ID Unavailable
    description: All candidate Planning IDs for the cell are taken.
    severity: CRITICAL
    resource: /network/cells/cell[id=%s]
    visibility: engineer
    remediation: Contact Tarana Support to assist you for Planning ID.
  - code: cell-planning-id-mismatch
    title: Planning ID Mismatch
    description: Configured Cell Planning ID does not match with the TCS recommended Planning ID.
    severity: MAJOR
    resource: /network/cells/cell[id=%s]
    visibility: engineer
    remediation: Change the Planning ID to TCS-derived value. Note that this lead to temporary disconnection
      of all the links in this cell.
  - code: sector-planning-id-mismatch
    title: Planning ID Mismatch
    description: Configured Sector Planning ID does not match with the TCS recommended Planning ID.
    severity: MAJOR
    resource: /network/sectors/sector[id=%s]
    visibility: engineer
    remediation: Change the Planning ID to recommended Planning ID. Note that this will lead to a temporary
      disconnection of all the links in this cell.
  - code: inter-bn-distance-exceed
    title: Inter-BN Distance Exceeded
    description: The distance between BNs of the same cell is more than 100 meters.
    severity: MAJOR
    resource: /network/cells/cell[id=%s]
    visibility: engineer
    remediation: Re-locate BNs to meet recommended distance between BNs. Recommended maximum distance
      is 100 m.
  - code: etsi-incompatible-software-booted
    title: ETSI Incompatible Software Booted
    description: Device booted with software lacking DFS support causing non-compliance with ETSI regulations.
    severity: MAJOR
    resource: /network/radios/radio[device-id=%s]
    visibility: engineer
    remediation: Upgrade software or switch boot bank to ensure device operating under ETSI domain boots
      with a newer software. G1 BN-5 & RN-5 need to be on software version 3.0 or later. G1 BN-6, RN-6
      & RNv-6 need to be on software version 4.2 or later.
  - code: incompatible-dhcp-option82-config
    title: Incompatible Sector configuration for DHCP Option82
    description: Sector is configured for configuration (DHCP option 82) which BN software is not capable
      of.
    severity: MINOR
    resource: /network/radios/radio[device-id=%s]
    visibility: engineer
    remediation: Upgrade BN software version to 3.0 and above.
  - code: sector-rn-configuration-conflict
    title: Sector RN Configuration Conflict
    description: 1 or more RN's connected to the same BN have conflicting C-VLAN configuration
    severity: MAJOR
    resource: /network/radios/radio[device-id=%s]
    visibility: viewer
    remediation: Configure each RN to have a unique C_VLAN connecting to the same BN

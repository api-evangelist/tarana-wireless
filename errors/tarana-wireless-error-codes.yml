method: searched
source: https://portal.tcs.taranawireless.com/operator-portal/common-config.js
name: Tarana Cloud Suite — alarm, event and API error catalog
note: 'Tarana publishes its complete TCS alarm and event vocabulary as an anonymous, unauthenticated JavaScript
  configuration file that the operator portal loads at page load. Everything below is copied verbatim
  from that file; nothing is inferred. This is the non-payments sibling of a decline-code reference: it
  is the registry an operator integration has to switch on. It is NOT an HTTP problem-type catalog — the
  TCS northbound OpenAPI is RBAC-gated, so no RFC 9457 problem types could be derived. The one HTTP-level
  error shape recorded here was observed live on the public TCS API gateway.'
formats:
  rfc9457: false
  note: The TCS API gateway returns a proprietary JSON envelope, not application/problem+json.
http_error_envelope:
  method: probed
  observed_at: https://api.tcs.taranawireless.com/
  observed: '2026-08-29'
  http_status: 403
  content_type: application/json
  shape:
    data: null on error
    error:
      code: integer, mirrors the HTTP status
      message: human-readable string
      status: short machine label
  example:
    data: null
    error:
      code: 403
      message: The HTTP method or resources may not be supported.
      status: Unsupported API
  note: 'Served by AWS API Gateway (x-amzn-errortype: MissingAuthenticationTokenException). access-control-allow-origin
    is pinned to https://portal.tcs.taranawireless.com.'
device_alarms:
  count: 160
  raw_definition_rows: 709
  note: The source file carries one row per alarm/YANG-resource pair; the 709 rows collapse to 160 unique
    alarm codes. severity[] and event_type[] list every value a code is defined with.
  severity_scale:
  - CRITICAL
  - MAJOR
  - MINOR
  - WARNING

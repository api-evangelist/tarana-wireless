note: >-
  Tarana publishes NO pricing of any kind — not for the G1 hardware, not for the Tarana Cloud
  Suite subscription, and not for northbound API access. This is an honest zero, not a gap in
  the search. The company sells through a distributor and channel motion: /how-to-buy/ routes
  a buyer to authorized distributors and a "request a call" form, and /promos-and-financing/
  advertises financing programs without naming a price. The northbound API is not sold
  separately at all — it is a capability of a TCS tenant, which comes with the radios, so
  there is no API plan, no quota, no overage and no metered tier to record.
api_pricing_model: bundled with the Tarana Cloud Suite tenant; not separately priced or metered

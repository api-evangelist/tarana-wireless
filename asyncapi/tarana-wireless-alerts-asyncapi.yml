        - deviceSoftware
        - deviceType
        - deviceUptimeSeconds
        - notificationGeneratedAt
        properties:
          alertName: *id001
          notificationGeneratedAt: *id002
          alarmType: *id018
          alarmName: *id019
          alarmDescription: *id020
          alarmCreatedAt: *id021
          alarmSeverity: *id022
          alarmState: *id023
          deviceHostname: *id003
          deviceSerialNumber: *id004
          deviceType: *id005
          deviceSoftware: *id006
          operator: *id007
          region: *id008
          market: *id009
          site: *id010
          cell: *id011
          sector: *id012

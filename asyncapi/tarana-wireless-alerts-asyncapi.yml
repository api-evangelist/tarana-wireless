      summary: 'TCS alert notification: RN Ethernet Port Down'
      payload:
        type: object
        required:
        - alarmCreatedAt
        - alarmDescription
        - alarmName
        - alarmSeverity
        - alarmState
        - alarmType
        - alertName
        - deviceBootReason
        - deviceHostname
        - deviceSerialNumber
        - deviceSoftware
        - deviceType
        - deviceUptimeSeconds
        - notificationGeneratedAt
        properties:
          alertName: *id001
          notificationGeneratedAt: *id002
          alarmType: &id018
            type: string
            description: Alarm Type
            examples:
            - Test_AlarmType
          alarmName: &id019
            type: string
            description: Alarm Name
            examples:
            - Test_AlarmName
          alarmDescription: &id020
            type: string
            description: Alarm Description
            examples:
            - Test_AlarmDescription
          alarmCreatedAt: &id021
            type: string
            description: Alarm Created At (rendered as a formatted UTC date string, e.g. "05 Feb 2024
              14:54:32 UTC")
            examples:
            - 05 Feb 2024 14:54:32 UTC
          alarmSeverity: &id022
            type: integer
            description: Alarm Severity
            examples:
            - Critical
          alarmState: &id023
            type: string
            description: Alarm State
            examples:
            - Alarm Raised
          deviceHostname: *id003
          deviceSerialNumber: *id004
          deviceType: *id005
          deviceSoftware: *id006
          operator: *id007
          region: *id008
          market: *id009
          site: *id010
          cell: *id011
          sector: *id012
          deviceUptimeSeconds: *id013
          deviceUptime: *id014
          deviceBootReason: *id016
    RN_ETHERNET_PORT_IS_UP:
      name: RN_ETHERNET_PORT_IS_UP

telemetry:
  model: device-to-cloud dial-out subscription
  default_sample_interval_seconds: 60
  time_of_transmission_sample_interval_seconds: 15
  source: https://portal.tcs.taranawireless.com/operator-portal/env-config.js
reversibility:
  grade: documented
  na: false
  note: >-
    GRADED "documented", NOT "verified", and the distinction is deliberate. TCS clearly has
    reversible write operations — its own event vocabulary names the reversal events — but
    Tarana publishes no window for any of them on an anonymously reachable surface, and this
    pipeline will not invent one. An agent must treat every window below as unknown and
    confirm it against the TCS Administration Guide before acting.
  evidence_source: https://portal.tcs.taranawireless.com/operator-portal/common-config.js
  write_surfaces:
  - action: Alert / alarm acknowledgement
    reversal: Un-acknowledge
    reversal_evidence: >-
      ALARM_OPERATIONS event type; the portal exposes an acknowledge/NACK pair with a
      MAX_DEVICES_TO_ACK_NACK bulk cap of 1000.
    window: unknown
    operation_id: null
  - action: Device software upgrade
    reversal: Boot-bank switchover (revert to the previous image)
    reversal_evidence: >-
      BOOTBANK_SWITCH event type and the boot-bank-switchover alarm code. Radios hold two
      boot banks, so the previous image remains bootable.
    window: unknown
    window_note: >-
      How long the previous image is retained in the inactive bank before it is overwritten by
      a subsequent upgrade is not published.
    operation_id: null
  - action: Auto-upgrade schedule
    reversal: Cancel before the scheduled start
    reversal_evidence: >-
      AUTO_UPGRADE event type carries startTime and endTime fields on the notification
      payload, so the schedule is a window an operator can act inside.
    window: 'stated as a schedule, not as a reversal window'
    operation_id: null
  - action: CBRS spectrum grant
    reversal: Grant relinquishment
    reversal_evidence: GRANT_RELINQUISHMENT and REACQUIRE_SPECTRUM event types.
    window: unknown
    window_note: >-
      Governed by the SAS heartbeat/grant lifecycle (WInnForum SAS-CBSD), not by a
      Tarana-stated window.
    operation_id: null
  - action: Radio carrier mute
    reversal: Carrier enable
    reversal_evidence: >-
      RADIO_CARRIER_MUTED and RADIO_CARRIER_ENABLED are both first-class alert types.
    window: none required (symmetric operation)
    operation_id: null
  - action: Device removal from the network
    reversal: unknown
    reversal_evidence: >-
      DEVICE_REMOVED is an event type; no restore or undelete counterpart appears in the
      published vocabulary.
    window: unknown
  - action: User / operator management changes
    reversal: unknown
    reversal_evidence: USER_MANAGEMENT_OPERATIONS and OPERATOR_MANAGEMENT_OPERATIONS event types.
    window: unknown
dry_run_mode:
  supported: unknown
  note: >-
    TCS ships diagnostic operations (link round-trip and downlink rate tests, cable test,
    speed test) with published parameter ranges, which let an operator rehearse a link before
    committing traffic. That is diagnostic tooling, not a dry-run mode on write operations, so
    it is not counted as one.

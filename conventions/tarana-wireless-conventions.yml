generated: '2026-08-29'
method: probed
source: >-
  https://portal.tcs.taranawireless.com/operator-portal/env-config.js and
  https://portal.tcs.taranawireless.com/operator-portal/common-config.js (both anonymous),
  plus live probes of api.tcs.taranawireless.com and portal.tcs.taranawireless.com/northbound
name: Tarana Cloud Suite — cross-cutting API conventions
note: >-
  HONEST SCOPE WARNING. The TCS northbound OpenAPI is RBAC-gated, so none of this was derived
  from a contract. Every entry below is either observed on a live anonymous response or read
  from configuration Tarana serves publicly. Where a convention could not be established, it
  says unknown rather than carrying a plausible default — a guessed idempotency header or a
  guessed pagination parameter is worse than an admitted gap, because an agent would act on
  it.
auth_style:
  summary: >-
    RBAC behind an operator tenant. Portal users authenticate through an OAuth 2.0
    authorization server at idp.tcs.taranawireless.com; the northbound API credential type is
    not publicly documented.
  detail: authentication/tarana-wireless-authentication.yml
error_envelope:
  method: probed
  observed_at: https://api.tcs.taranawireless.com/
  content_type: application/json
  rfc9457: false
  shape:
    data: null on error, payload on success
    error:
      code: integer, mirrors the HTTP status
      message: human-readable string
      status: short machine label
  example:
    data: null
    error:
      code: 403
      message: The HTTP method or resources may not be supported.
      status: Unsupported API
  detail: errors/tarana-wireless-error-codes.yml
  note: >-
    A data/error envelope means the HTTP status is duplicated in the body; a client must read
    error.status, not only the status line, to distinguish gateway refusals from application
    errors. Whether the northbound API under /northbound uses this same envelope could not be
    verified — the gateway host and the portal host are different edges.
idempotency:
  supported: unknown
  header: null
  scope: null
  retention: null
  note: >-
    NOT DETERMINED. No idempotency key header, replay window or retention policy is stated on
    any anonymously reachable Tarana surface, and the spec that would show one is gated. This
    matters more than usual here: the northbound API performs device reboots, software
    upgrades, spectrum grant changes and subscriber provisioning, all of which are expensive
    to double-fire. Recorded as unknown; not asserted either way.

metadata:
  supported: unknown
request_id_tracing:
  supported: true
  method: probed
  header: x-request-id
  evidence: >-
    Observed on the 301 from https://tcs.taranawireless.com/ — the istio-envoy ingress emits
    an x-request-id UUID on responses (example 498a4bf9-087e-4721-ae8d-cceea7d1aaa6). Whether
    a client-supplied x-request-id is honoured and echoed is not documented.
versioning:
  api_path_version: >-
    The internal service map exposes /api/tcs/v1/... and /api/nqs/v1/... paths, so the
    platform versions in the URL path at v1. The public northbound base path is
    /northbound with no version segment observed.
  device_software_scheme: >-
    Radio software is versioned as SYS.<hw-arch>.<node-role>.<variant>.<major>.<minor>.<patch>.<build>,
    e.g. SYS.A3.R10.XXX.3.013.000.00 for a remote node and SYS.A4.B10.XXX.4.931.019.02 for a
    G2 base node. 146 versions are enumerated in the portal config, each flagged for base-node
    and remote-node compatibility.
  portal_version: 0.9 (window._env_.APP_VERSION)
  detail: lifecycle/tarana-wireless-lifecycle.yml
